<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DawnMate - Connexion</title>
  <style>
    :root {
      --bg-light: #ffffff;
      --text-light: #121212;
      --card-light: #f5f5f5;
      --primary-color: #000000;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-light);
      color: var(--text-light);
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #ddd;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      color: var(--primary-color);
    }

    .login-container {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 10px;
      background-color: var(--card-light);
      border: 1px solid #ddd;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }

    .login-card h2 {
      margin: 0 0 20px;
      text-align: center;
      color: var(--primary-color);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    label {
      font-weight: 500;
    }

    input {
      padding: 12px;
      border-radius: 5px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 12px 0;
      border-radius: 5px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 16px;
    }

    button[type="submit"] {
      background-color: var(--primary-color);
      color: white;
    }

    button.inscription {
      background-color: #e0e0e0;
      color: #121212;
    }

    button:hover {
      opacity: 0.95;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <header>
    <h1>DawnMate</h1>
    

  </header>

  <div class="login-container">
    <div class="login-card">
      <h2>Connexion</h2>
      <form method="POST" action="loginU.php">
        <div class="form-group">
          <label for="pseudo">Pseudo :</label>
          <input type="text" id="pseudo" name="pseudo" required />
        </div>

        <div class="form-group">
          <label for="pwd">Mot de passe :</label>
          <input type="password" id="pwd" name="pwd" required />
        </div>

        <div class="buttons">
          <button type="submit">Se connecter</button>
          <button type="button" class="inscription" onclick="window.location.href='inscription.html'">S'inscrire</button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
