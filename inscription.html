<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DawnMate - Création de compte</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .register-container {
            max-width: 450px;
            margin: 100px auto;
            padding: 30px;
            border: 1px solid #ccc;
            border-radius: 15px;
            background-color: #fdfdfd;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
        }

        .register-container h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .register-container input[type="text"],
        .register-container input[type="email"],
        .register-container input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #bbb;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .register-container button {
            width: 100%;
            padding: 12px;
            background-color: black;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .register-container button:hover {
            background-color: #333;
        }

        .register-container .link {
            text-align: center;
            margin-top: 10px;
        }

        .register-container .link a {
            text-decoration: none;
            color: #333;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1>DawnMate</h1>
            
                
                
                
            
        </div>
    </header>

    <div class="register-container">
        <h2>Créer un compte</h2>
        <form method="POST" action="inscription.php">
            <input type="text" name="prenom" placeholder="Prénom" required>
            <input type="text" name="nom" placeholder="Nom" required>
            <input type="text" name="identifiant" placeholder="Nom d'utilisateur" required>
            <input type="password" name="mdp" placeholder="Mot de passe" required>
            <input type="password" name="mdp_confirm" placeholder="Confirmer le mot de passe" required>
            <button type="submit">S'inscrire</button>
        </form>
        <div class="link">
            <a href="loginU.html">Déjà un compte ? Connecte-toi</a>
        </div>
    </div>

    
    <footer>
        <div class="container">
            <div class="footer-left">
                <p>DawnMate</p>
            </div>
            <div class="footer-right">
                <a href="#"><img src="facebook-icon.png" alt="Facebook"></a>
                <a href="#"><img src="linkedin-icon.png" alt="LinkedIn"></a>
                <a href="#"><img src="youtube-icon.png" alt="YouTube"></a>
                <a href="#"><img src="instagram-icon.png" alt="Instagram"></a>
            </div>
        </div>
    </footer>
</body>
</html>
